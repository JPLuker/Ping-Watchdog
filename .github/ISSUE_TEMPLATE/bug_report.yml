name: Bug report
description: Report a problem with monitoring, the interface, or installation.
body:
  - type: input
    id: environment
    attributes:
      label: App version, operating system and package
      placeholder: e.g. 1.19.22, Windows 11, portable ZIP
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the screen and action. Use sample hosts and redact network details.
  - type: textarea
    id: evidence
    attributes:
      label: Optional screenshot or diagnostic details
      description: Review and redact usernames, paths and host details before posting.

name: Validate Linux

on:
  pull_request:
    paths:
      - "linux/**"
      - "HostImport.cs"
      - "DisplayTime.cs"
      - "tools/package_linux.sh"
      - "tools/collect_linux_notices.py"
      - ".github/workflows/validate-linux.yml"
  push:
    branches: [ "linux/**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  correctness:
    name: Linux ${{ matrix.backend }} at ${{ matrix.scale }}x
    strategy:
      fail-fast: false
      matrix:
        include:
          - { backend: x11, scale: "1", captures: true }
          - { backend: x11, scale: "1.5", captures: false }
          - { backend: x11, scale: "2", captures: false }
          - { backend: wayland, scale: "1", captures: false }
    env:
      WATCHDOG_BACKEND: ${{ matrix.backend }}
      AVALONIA_SCREEN_SCALE_FACTORS: ${{ matrix.scale }}
      WATCHDOG_EXPECTED_SCALE: ${{ matrix.scale }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "8.0.x"
      - name: Install desktop test prerequisites
        run: sudo apt-get update && sudo apt-get install -y xvfb openbox dbus-x11 libx11-6 libice6 libsm6 libfontconfig1 weston libegl1 libgl1-mesa-dri libwayland-client0
      - name: Check for vulnerable packages
        run: |
          dotnet restore linux/PingWatchdog.Linux/PingWatchdog.Linux.csproj
          report=$(dotnet list linux/PingWatchdog.Linux/PingWatchdog.Linux.csproj package --vulnerable --include-transitive 2>&1)
          echo "$report"
          if grep -q "has the following vulnerable packages" <<<"$report"; then echo "::error::Vulnerable NuGet packages found."; exit 1; fi
      - name: Engine and desktop-service regressions
        run: dotnet run --project linux/PingWatchdog.Linux/PingWatchdog.Linux.csproj -c Release -- --self-test
      - name: Desktop regressions
        run: timeout 300s dbus-run-session -- bash linux/test-desktop.sh
      # Artifacts aren't reachable from every review environment, so the captures are also printed to the log.
      - name: Print UI captures for review
        if: always() && matrix.captures
        run: |
          for file in $(ls ui-regression-images/*.png 2>/dev/null | sort); do
            echo "REVIEW_IMAGE_NAME $(basename "$file")"
            echo "REVIEW_IMAGE_BEGIN$(base64 -w0 "$file")REVIEW_IMAGE_END"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        continue-on-error: true
        with:
          name: linux-ui-${{ matrix.backend }}-${{ matrix.scale }}
          path: ui-regression-images/*
          if-no-files-found: warn

  packages:
    name: Linux packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "8.0.x"
      - name: Build and check every package
        run: bash linux/build-packages.sh validate

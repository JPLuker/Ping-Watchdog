name: Validate Linux Correctness

on:
  pull_request:
    paths:
      - "linux/**"
      - "Shared/**"
      - ".github/workflows/validate-linux.yml"
  push:
    branches: [ "linux/**" ]
    paths:
      - "linux/**"
      - "Shared/**"
      - ".github/workflows/validate-linux.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-shared-contract:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Validate Windows consumers of shared presentation code
        run: dotnet run --project PingWatchdog.csproj -c Release -- --self-test
      - name: Exercise Windows UI
        run: dotnet run --no-build --project PingWatchdog.csproj -c Release -- --ui-smoke-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-reference-ui
          path: ui-smoke-test/*
  correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install desktop test prerequisites
        run: sudo apt-get update && sudo apt-get install -y xvfb openbox dbus-x11 libx11-6 libice6 libsm6 libfontconfig1
      - name: Run core regressions
        run: dotnet run --project linux/PingWatchdog.Linux/PingWatchdog.Linux.csproj -c Release -- --self-test
      - name: Run desktop regressions
        env:
          WATCHDOG_UI_PREVIEW: "1"
        run: timeout 90s dbus-run-session -- xvfb-run -a bash -c 'openbox >/tmp/watchdog-openbox.log 2>&1 & dotnet run --no-build --project linux/PingWatchdog.Linux/PingWatchdog.Linux.csproj -c Release -- --ui-regression-test'

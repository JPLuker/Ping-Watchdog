name: Validate Windows changes
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x
      - name: Check for vulnerable packages
        shell: pwsh
        run: |
          dotnet restore PingWatchdog.csproj
          $report = dotnet list PingWatchdog.csproj package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Output $report
          if ($report -match "has the following vulnerable packages") { throw "Vulnerable NuGet packages found." }
      - name: Host imports, configuration, monitoring and existing regressions
        run: dotnet run --project PingWatchdog.csproj -c Release -- --self-test
      - name: UI regression checks
        run: dotnet run --project PingWatchdog.csproj -c Release -- --ui-smoke-test
      # Artifacts aren't reachable from every review environment, so the captures are also printed to the log.
      - name: Print UI captures for review
        if: always()
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem "ui-smoke-test" -Filter "*.png" -Recurse -ErrorAction SilentlyContinue | Sort-Object Name) {
            Write-Output ("REVIEW_IMAGE_NAME " + $file.Name)
            Write-Output ("REVIEW_IMAGE_BEGIN" + [Convert]::ToBase64String([IO.File]::ReadAllBytes($file.FullName)) + "REVIEW_IMAGE_END")
          }
      - continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-validation-ui
          path: ui-smoke-test/**
          if-no-files-found: warn

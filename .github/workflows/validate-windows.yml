name: Validate Windows changes
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x
      - name: Check for vulnerable packages
        shell: pwsh
        run: |
          dotnet restore PingWatchdog.csproj
          $report = dotnet list PingWatchdog.csproj package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Output $report
          if ($report -match "has the following vulnerable packages") { throw "Vulnerable NuGet packages found." }
      - name: Host imports, configuration, monitoring and existing regressions
        run: dotnet run --project PingWatchdog.csproj -c Release -- --self-test
      - name: UI regression checks
        run: dotnet run --project PingWatchdog.csproj -c Release -- --ui-smoke-test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: windows-validation-ui
          path: ui-smoke-test/**
          if-no-files-found: warn

name: Apply Monitoring Semantics Hotfix

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/apply-monitoring-hotfix.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch-test-push:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Apply source hotfix
        shell: pwsh
        run: python .github/scripts/apply-monitoring-hotfix.py

      - name: Verify patch shape
        shell: pwsh
        run: |
          git diff --check
          git diff --stat

      - name: Run Windows self-tests before push
        shell: pwsh
        run: dotnet run --project PingWatchdog.csproj -c Release -- --self-test

      - name: Commit tested hotfix and remove one-time patch machinery
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-monitoring-hotfix.yml .github/scripts/apply-monitoring-hotfix.py
          git add -A
          git commit -m "Keep topology local and make Enabled authoritative (1.14.63)"
          git push origin HEAD:main

      - name: Dispatch normal Windows release pipeline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Start-Sleep -Seconds 8
          gh workflow run build-windows.yml --ref main

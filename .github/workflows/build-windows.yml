name: Build Windows Package

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "**/*.cs"
      - "**/*.csproj"
      - "Assets/**"
      - "default.pingwatch.json"
      - "README-FIRST.txt"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Validate starter config
        shell: pwsh
        run: |
          $config = Get-Content default.pingwatch.json -Raw | ConvertFrom-Json
          if (-not $config.Sites -or $config.Sites.Count -lt 1) { throw "Starter config must contain a site." }

      - name: Test alert, config, and localhost behavior
        run: dotnet run --project PingWatchdog.csproj -c Release -- --self-test

      - name: Publish self-contained EXE
        run: dotnet publish PingWatchdog.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o publish

      - name: Build portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item publish/PingWatchdog.exe package/PingWatchdog.exe
          Copy-Item default.pingwatch.json package/default.pingwatch.json
          Copy-Item README-FIRST.txt package/README-FIRST.txt
          Compress-Archive -Path package/* -DestinationPath PingWatchdog-win-x64.zip -Force

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PingWatchdog-win-x64
          path: PingWatchdog-win-x64.zip
          if-no-files-found: error

      - name: Publish release download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "v1.5.0-build.${{ github.run_number }}"
          gh release create $tag PingWatchdog-win-x64.zip --title "Ping Watchdog $tag" --notes "Portable Windows x64 ZIP with live-editable Sites/Groups, automatic per-host ping-worker reconciliation, first-launch default config, local autosave, popup site management, host nicknames, dark mode, and optional live CMD trace."

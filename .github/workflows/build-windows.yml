name: Build Windows Auto-Updating Release

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "*.cs"
      - "Shared/**"
      - "PingWatchdog.csproj"
      - "Assets/**"
      - "default.pingwatch.json"
      - "README-FIRST.txt"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"

      - name: Set release version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content PingWatchdog.csproj -Raw)).Project.PropertyGroup.Version
          "WATCHDOG_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Never reuse a published version: stop before building if this tag already exists.
      - name: Check version is unpublished
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & gh release view "v$env:WATCHDOG_VERSION" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { throw "v$env:WATCHDOG_VERSION is already published. Increment Version in PingWatchdog.csproj." }
          $global:LASTEXITCODE = 0

      - name: Check for vulnerable packages
        shell: pwsh
        run: |
          dotnet restore PingWatchdog.csproj
          $report = dotnet list PingWatchdog.csproj package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Output $report
          if ($report -match "has the following vulnerable packages") { throw "Vulnerable NuGet packages found; update them before publishing." }

      - name: Install matching Velopack CLI
        shell: pwsh
        run: dotnet tool install --tool-path .\.tools vpk --version 1.2.161

      - name: Validate starter config
        shell: pwsh
        run: |
          $config = Get-Content default.pingwatch.json -Raw | ConvertFrom-Json
          if (-not $config.Sites -or $config.Sites.Count -lt 1) { throw "Starter config must contain a site." }

      - name: Test alert, config, localhost, and updater wiring
        shell: pwsh
        run: dotnet run --project PingWatchdog.csproj -c Release -p:Version=$env:WATCHDOG_VERSION -- --self-test

      - name: Publish self-contained app
        shell: pwsh
        run: |
          dotnet publish PingWatchdog.csproj -c Release -r win-x64 --self-contained true -p:Version=$env:WATCHDOG_VERSION -p:PublishSingleFile=true -p:PublishTrimmed=false -o publish
          Copy-Item default.pingwatch.json publish\default.pingwatch.json
          Copy-Item README-FIRST.txt publish\README-FIRST.txt
          Copy-Item LICENSE publish\LICENSE

      - name: Smoke test published Windows app startup
        shell: pwsh
        run: |
          $exe = (Resolve-Path "publish\PingWatchdog.exe").Path
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5

          if ($process.HasExited) {
            throw "Published Ping Watchdog exited during startup smoke test with exit code $($process.ExitCode)."
          }

          Stop-Process -Id $process.Id -Force

      - name: Exercise published UI, host selection, Settings, and Wallboard
        shell: pwsh
        run: |
          $exe = (Resolve-Path "publish\PingWatchdog.exe").Path
          $process = Start-Process -FilePath $exe -ArgumentList "--ui-smoke-test" -PassThru
          if (-not $process.WaitForExit(45000)) {
            Stop-Process -Id $process.Id -Force
            throw "UI smoke test did not finish; the application may be blocked by an error dialog."
          }
          if ($process.ExitCode -ne 0 -or -not (Test-Path "ui-smoke-test\passed.txt")) {
            if (Test-Path "ui-smoke-test\failed.txt") { Get-Content "ui-smoke-test\failed.txt" }
            throw "Published Ping Watchdog failed UI smoke test (exit $($process.ExitCode))."
          }

      - name: Render appearance review sheet
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $files = @(Get-ChildItem "ui-smoke-test/appearance-*.png" | Sort-Object Name)
          # Main window and Settings in light and dark; the Hosts window was retired in v1.19.1.
          if ($files.Count -ne 4) { throw "Expected four appearance screenshots (main and Settings, light and dark)." }
          $sheet = [System.Drawing.Bitmap]::new(1200, 1200)
          $graphics = [System.Drawing.Graphics]::FromImage($sheet)
          $graphics.Clear([System.Drawing.Color]::White)
          for ($i = 0; $i -lt $files.Count; $i++) {
            $source = [System.Drawing.Image]::FromFile($files[$i].FullName)
            $scale = [Math]::Min(600.0 / $source.Width, 380.0 / $source.Height)
            $x = ($i % 2) * 600
            $y = [Math]::Floor($i / 2) * 400
            $graphics.DrawString($files[$i].BaseName, [System.Drawing.SystemFonts]::DefaultFont, [System.Drawing.Brushes]::Black, [single]$x, [single]$y)
            $graphics.DrawImage($source, [int]$x, [int]($y + 20), [int]($source.Width * $scale), [int]($source.Height * $scale))
            $source.Dispose()
          }
          $graphics.Dispose()
          $sheet.Save("ui-smoke-test/appearance-review.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $sheet.Dispose()
          Write-Output ("APPEARANCE_IMAGE_BEGIN" + [Convert]::ToBase64String([IO.File]::ReadAllBytes("ui-smoke-test/appearance-review.png")) + "APPEARANCE_IMAGE_END")
          foreach ($name in @("workspace-populated-Dark", "workspace-populated-Light", "update-status-Dark", "update-status-Light", "workspace-list-Dark", "workspace-list-Light", "update-popup-Dark", "update-popup-Light")) {
            Write-Output ("WORKSPACE_IMAGE_BEGIN" + [Convert]::ToBase64String([IO.File]::ReadAllBytes("ui-smoke-test/$name.png")) + "WORKSPACE_IMAGE_END")
          }
          foreach ($name in @("appearance-settings-Light", "appearance-settings-Dark", "settings-save-error-Light", "settings-save-error-Dark")) {
            Write-Output ("SETTINGS_IMAGE_BEGIN" + [Convert]::ToBase64String([IO.File]::ReadAllBytes("ui-smoke-test/$name.png")) + "SETTINGS_IMAGE_END")
          }
          foreach ($name in @("support-about-Light", "support-about-Dark", "support-diagnostics-Light", "support-diagnostics-Dark")) {
            Write-Output ("SUPPORT_IMAGE_BEGIN" + [Convert]::ToBase64String([IO.File]::ReadAllBytes("ui-smoke-test/$name.png")) + "SUPPORT_IMAGE_END")
          }
          foreach ($name in @("data-settings-Light", "data-settings-Dark", "data-delete-Light", "data-delete-Dark", "data-confirm-Light", "data-confirm-Dark")) {
            Write-Output ("DATA_IMAGE_BEGIN" + [Convert]::ToBase64String([IO.File]::ReadAllBytes("ui-smoke-test/$name.png")) + "DATA_IMAGE_END")
          }
          foreach ($name in @("wallboard", "wallboard-narrow", "wallboard-dense")) {
            Write-Output ("WALLBOARD_IMAGE_BEGIN" + [Convert]::ToBase64String([IO.File]::ReadAllBytes("ui-smoke-test/$name.png")) + "WALLBOARD_IMAGE_END")
          }

      - name: Upload UI smoke-test screenshots and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PingWatchdog-UI-${{ env.WATCHDOG_VERSION }}
          path: ui-smoke-test/*
          if-no-files-found: warn

      - name: Test startup crash recovery and isolated updater
        shell: pwsh
        run: |
          $exe = (Resolve-Path "publish\PingWatchdog.exe").Path
          $process = Start-Process -FilePath $exe -ArgumentList "--recovery-smoke-test" -PassThru
          if (-not $process.WaitForExit(120000)) {
            Stop-Process -Id $process.Id -Force
            throw "Startup recovery tests timed out."
          }
          if ($process.ExitCode -ne 0 -or -not (Test-Path "ui-smoke-test\recovery\passed.txt")) {
            if (Test-Path "ui-smoke-test\recovery\failed.txt") { Get-Content "ui-smoke-test\recovery\failed.txt" }
            throw "Startup recovery tests failed (exit $($process.ExitCode))."
          }

      - name: Upload recovery screenshots and reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PingWatchdog-Recovery-${{ env.WATCHDOG_VERSION }}
          path: ui-smoke-test/recovery/**
          if-no-files-found: warn

      - name: Write release notes
        shell: pwsh
        run: |
          @"
          # Ping Watchdog $env:WATCHDOG_VERSION

          - Automatic update checks run at most once a day, including across restarts. Check for updates still works any time.
          - IT can turn updates off with HKLM\Software\Policies\PingWatchdog DisableUpdates = 1 or PINGWATCHDOG_DISABLE_UPDATES=1; Settings then says updates are managed by your organization.

          Iterative UI update for user testing. The final design migration and maintenance-mode acceptance remain in progress.

          "@ | Set-Content release-notes.md

      # Retried: a silent failure here drops the small delta update (seen once in v1.18.14).
      - name: Download previous Velopack release for delta generation
        continue-on-error: true
        shell: pwsh
        env:
          VPK_TOKEN: ${{ github.token }}
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            .\.tools\vpk.exe download github --repoUrl https://github.com/JPLuker/Ping-Watchdog --token $env:VPK_TOKEN --channel win --outputDir Releases
            if ($LASTEXITCODE -eq 0 -and (Get-ChildItem Releases -Filter "*-full.nupkg" -ErrorAction SilentlyContinue)) { exit 0 }
            Write-Output "Previous release download attempt $attempt failed; retrying."
            Start-Sleep -Seconds (10 * $attempt)
          }
          exit 1

      - name: Build installer, portable package, and update feed
        shell: pwsh
        run: |
          .\.tools\vpk.exe pack --packId PingWatchdog --packVersion $env:WATCHDOG_VERSION --packDir publish --mainExe PingWatchdog.exe --packTitle "Ping Watchdog" --packAuthors "Joseph Luker" --runtime win-x64 --icon Assets\WatchdogIcon.ico --releaseNotes release-notes.md --channel win --outputDir Releases

      # Every required asset must exist; a missing delta is a visible warning, not a silent gap.
      - name: Verify assets and write checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = $env:WATCHDOG_VERSION
          $required = @("PingWatchdog-$v-full.nupkg", "PingWatchdog-win-Setup.exe", "PingWatchdog-win-Portable.zip", "RELEASES", "releases.win.json")
          $missing = @($required | Where-Object { -not (Test-Path "Releases\$_") })
          if ($missing.Count -gt 0) { throw "Missing release assets: $($missing -join ', ')" }
          $previous = & gh release list --repo "${{ github.repository }}" --limit 1 --json tagName --jq length
          $deltaNote = ""
          if (-not (Test-Path "Releases\PingWatchdog-$v-delta.nupkg") -and $previous -ne "0") {
            Write-Output "::warning title=No delta package::v$v ships without a delta; updates download the full package."
            $deltaNote = "This update downloads the full package (no delta was produced)."
          }
          "DELTA_NOTE=$deltaNote" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $files = @($required + "PingWatchdog-$v-delta.nupkg") | Where-Object { Test-Path "Releases\$_" }
          $lines = $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash "Releases\$_" -Algorithm SHA256).Hash.ToLowerInvariant(), $_ }
          Set-Content -Path "Releases\SHA256SUMS.txt" -Value $lines -Encoding ascii
          Get-Content "Releases\SHA256SUMS.txt"

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PingWatchdog-${{ env.WATCHDOG_VERSION }}
          path: Releases/*
          if-no-files-found: error

      # Publish passing builds for user testing; final-release acceptance is tracked separately.
      - name: Publish release to GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:WATCHDOG_VERSION"
          # The GitHub page adds the unsigned-build notice; the in-app update notes stay as written.
          $body = (Get-Content release-notes.md -Raw).TrimEnd()
          if ($env:DELTA_NOTE) { $body += "`n`n$env:DELTA_NOTE" }
          $body += "`n`n---`nThese builds are not code-signed, so Windows SmartScreen may warn the first time you run the installer. Compare downloads with SHA256SUMS.txt: ``Get-FileHash .\PingWatchdog-win-Setup.exe -Algorithm SHA256``."
          Set-Content -Path release-body.md -Value $body -Encoding utf8
          $assets = @(
            "Releases\PingWatchdog-$env:WATCHDOG_VERSION-full.nupkg",
            "Releases\PingWatchdog-$env:WATCHDOG_VERSION-delta.nupkg",
            "Releases\PingWatchdog-win-Setup.exe",
            "Releases\PingWatchdog-win-Portable.zip",
            "Releases\RELEASES",
            "Releases\releases.win.json",
            "Releases\SHA256SUMS.txt"
          ) | Where-Object { Test-Path $_ }

          if ($assets.Count -lt 4) {
            throw "Expected Velopack release assets were not generated. Found $($assets.Count)."
          }

          & gh release create $tag @assets --repo "${{ github.repository }}" --title "Ping Watchdog $tag" --notes-file release-body.md --target "${{ github.sha }}"
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub CLI could not publish release $tag."
          }

name: Build Windows Auto-Updating Release

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "*.cs"
      - "Shared/**"
      - "PingWatchdog.csproj"
      - "Assets/**"
      - "default.pingwatch.json"
      - "README-FIRST.txt"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set release version
        shell: pwsh
        run: |
          "WATCHDOG_VERSION=1.14.${{ github.run_number }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install matching Velopack CLI
        shell: pwsh
        run: dotnet tool install --tool-path .\.tools vpk --version 1.2.161

      - name: Validate starter config
        shell: pwsh
        run: |
          $config = Get-Content default.pingwatch.json -Raw | ConvertFrom-Json
          if (-not $config.Sites -or $config.Sites.Count -lt 1) { throw "Starter config must contain a site." }

      - name: Test alert, config, localhost, and updater wiring
        shell: pwsh
        run: dotnet run --project PingWatchdog.csproj -c Release -p:Version=$env:WATCHDOG_VERSION -- --self-test

      - name: Publish self-contained app
        shell: pwsh
        run: |
          dotnet publish PingWatchdog.csproj -c Release -r win-x64 --self-contained true -p:Version=$env:WATCHDOG_VERSION -p:PublishSingleFile=true -p:PublishTrimmed=false -o publish
          Copy-Item default.pingwatch.json publish\default.pingwatch.json
          Copy-Item README-FIRST.txt publish\README-FIRST.txt
          Copy-Item LICENSE publish\LICENSE

      - name: Smoke test published Windows app startup
        shell: pwsh
        run: |
          $exe = (Resolve-Path "publish\PingWatchdog.exe").Path
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5

          if ($process.HasExited) {
            throw "Published Ping Watchdog exited during startup smoke test with exit code $($process.ExitCode)."
          }

          Stop-Process -Id $process.Id -Force

      - name: Exercise published UI, host selection, Settings, and Wallboard
        shell: pwsh
        run: |
          $exe = (Resolve-Path "publish\PingWatchdog.exe").Path
          $process = Start-Process -FilePath $exe -ArgumentList "--ui-smoke-test" -PassThru
          if (-not $process.WaitForExit(45000)) {
            Stop-Process -Id $process.Id -Force
            throw "UI smoke test did not finish; the application may be blocked by an error dialog."
          }
          if ($process.ExitCode -ne 0 -or -not (Test-Path "ui-smoke-test\passed.txt")) {
            if (Test-Path "ui-smoke-test\failed.txt") { Get-Content "ui-smoke-test\failed.txt" }
            throw "Published Ping Watchdog failed UI smoke test (exit $($process.ExitCode))."
          }

      - name: Upload UI smoke-test screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PingWatchdog-UI-${{ env.WATCHDOG_VERSION }}
          path: ui-smoke-test/*
          if-no-files-found: warn

      - name: Write release notes
        shell: pwsh
        run: |
          @"
          # Ping Watchdog $env:WATCHDOG_VERSION

          Self-updating Windows release.

          - Adds the exact supplied dog artwork beside the Wallboard title.
          - Sizes the main window's Wallboard button to fit its text, including larger UI fonts.
          - Verifies rendered Wallboard dog pixels and button text fit before publishing.
          - Restores the visual refresh using normal UI construction, with no idle startup hooks or reflection-based layout changes.
          - Uses the supplied dog SVG exactly for the header, application/tray icon, installer, and Linux package branding.
          - Refined cyan/teal accents and cleaner header/sidebar chrome, with version information retained in the footer.
          - Host selection, selected column, and scroll positions survive live data refreshes.
          - Published-EXE UI tests exercise responsive layouts, repeated host refreshes, Settings, and Wallboard with screenshots before release.
          - Centers the supplied dog beside the title/subtitle and tests the header group's vertical alignment.
          - Refreshes existing Watchdog desktop, Start menu, and pinned taskbar shortcut icons using a distinct dog icon path while preserving their launch settings.
          - Registers notification artwork explicitly and restores the updater's app identity for consistent taskbar grouping.
          - Checks GitHub Releases automatically on startup and every six hours.
          - Downloads updates in-app.
          - Downloads updates without interrupting monitoring, then exposes a one-click Restart to Update action.
          - Restart to Update saves the current setup, stops monitoring cleanly if needed, applies the downloaded update, and relaunches.
          - Fullscreen multi-monitor Wallboard / NOC mode with live topology, majority-aware degraded-site coloring, outage feed, real host status, toggleable live CLI trace, corrected responsive labels/header spacing, and Esc/F11 returning to the base window.
          - Version 1.9 modern desktop shell: stable app bar, overflow menu for secondary actions, tighter hierarchy, larger host workspace, and responsive navigation.
          - Persistent outage history with saved 24h / 7d / 30d / all-time filters, optional suspect suppression, full desktop history viewer, and Wallboard history integration.
          - Full Settings window for app behavior, monitoring defaults, history, Wallboard/CLI preferences, notifications, tray behavior, and permanent manual update checks.
          - Full-control Wallboard operations mode: start/stop monitoring, site selection and management, live host editing, host labels, monitoring defaults, config import/export, CLI clearing, history, settings, updates, and monitor switching from the fullscreen NOC UI.
          - Quiet background updater: startup checks and downloads run without occupying primary UI, then prompt once for restart. Manual controls remain in Settings, with an opt-in developer switch to expose update controls on the main screen and Wallboard.
          - Hierarchical site organization with persistent folders/subfolders, site moves, folder moves/renames, safe folder deletion, and a filesystem-style Organization window.
          - Wallboard topology renders individual host nodes with real status color, nickname/label, and IP address under each site hub.
          - Includes live site/host management, autosave, nicknames, grouping, dark mode, and live CMD trace.
          - Copyright © 2026 Joseph Luker. All rights reserved.

          Made by Joseph Luker.
          "@ | Set-Content release-notes.md

      - name: Download previous Velopack release for delta generation
        continue-on-error: true
        shell: pwsh
        env:
          VPK_TOKEN: ${{ github.token }}
        run: |
          .\.tools\vpk.exe download github --repoUrl https://github.com/JPLuker/Ping-Watchdog --token $env:VPK_TOKEN --channel win --outputDir Releases

      - name: Build installer, portable package, and update feed
        shell: pwsh
        run: |
          .\.tools\vpk.exe pack --packId PingWatchdog --packVersion $env:WATCHDOG_VERSION --packDir publish --mainExe PingWatchdog.exe --packTitle "Ping Watchdog" --packAuthors "Joseph Luker" --runtime win-x64 --icon Assets\WatchdogIcon.ico --releaseNotes release-notes.md --channel win --outputDir Releases

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: PingWatchdog-${{ env.WATCHDOG_VERSION }}
          path: Releases/*
          if-no-files-found: error

      - name: Publish Velopack release to GitHub
        shell: pwsh
        env:
          VPK_TOKEN: ${{ github.token }}
        run: |
          .\.tools\vpk.exe upload github --repoUrl https://github.com/JPLuker/Ping-Watchdog --token $env:VPK_TOKEN --channel win --outputDir Releases --publish --tag "v$env:WATCHDOG_VERSION" --releaseName "Ping Watchdog v$env:WATCHDOG_VERSION" --targetCommitish "${{ github.sha }}"

name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "**/*.cs"
      - "**/*.csproj"
      - "Assets/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test alert behavior and localhost ping
        run: dotnet run --project PingWatchdog.csproj -c Release -- --self-test

      - name: Publish self-contained EXE
        run: dotnet publish PingWatchdog.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o publish

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PingWatchdog-win-x64
          path: publish/PingWatchdog.exe
          if-no-files-found: error

      - name: Publish release download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "v1.3.0-build.${{ github.run_number }}"
          gh release create $tag publish/PingWatchdog.exe --title "Ping Watchdog $tag" --notes "Standalone Windows x64 app with persistent Sites/Groups, host nicknames, import/export scan configs, dark mode, site-filtered status grid, and optional live CMD ping trace."

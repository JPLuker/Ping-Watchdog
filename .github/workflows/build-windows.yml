name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "**/*.cs"
      - "**/*.csproj"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish self-contained EXE
        run: dotnet publish PingWatchdog.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o publish

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PingWatchdog-win-x64
          path: publish/PingWatchdog.exe
          if-no-files-found: error
